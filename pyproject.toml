[project]
name = "hotel-operations-django"
version = "0.1.0"
description = "Core Backend Engine for Hotel Operations"
readme = "README.md"
requires-python = ">=3.14,<3.15"

dependencies = [
    # ==========================================
    # Django Framework & REST
    # ==========================================
    "django>=6.0,<6.1",
    "djangorestframework>=3.16,<3.17",
    "djangorestframework-simplejwt>=5.5,<6.0",

    # ==========================================
    # API Documentation & Filtering
    # ==========================================
    "drf-spectacular>=0.28,<0.29",
    "django-filter>=25.1,<26.0",

    # ==========================================
    # Security & Configuration
    # ==========================================
    "django-cors-headers>=4.8,<5.0",
    "python-dotenv>=1.1,<2.0",

    # ==========================================
    # Database
    # ==========================================
    "psycopg[binary]>=3.2,<4.0",

    # ==========================================
    # Static & Media Files
    # ==========================================
    "Pillow>=11.0,<12.0",
    "whitenoise>=6.9,<7.0",
]

[dependency-groups]

dev = [
    "pytest>=8.4,<9.0",
    "pytest-django>=4.11,<5.0",

    "ruff>=0.12,<0.13",

    "django-debug-toolbar>=6.0,<7.0",
]

prod = [
    "gunicorn>=23.0,<24.0",
    "uvicorn>=0.35,<0.36",
]

# ==========================================
# Ruff Configuration
# ==========================================

[tool.ruff]
line-length = 100
target-version = "py314"

# ==========================================
# Pytest Configuration
# ==========================================

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = [
    "tests.py",
    "test_*.py",
    "*_tests.py",
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
